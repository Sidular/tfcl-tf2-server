name: Build and push TFCL TF2 server image

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Self-service on-demand /servers page (play.tfcleague.com).
          - plugin_dir: plugins
            tag: latest
          # TFCL Prime match bookings via /api/match-servers - SAME base
          # bundle PLUS tfcl_matchserver.smx (see Dockerfile header comment).
          # This tag was previously never actually built/pushed by this
          # workflow (only :latest + per-SHA were), which is why every
          # match-server boot's `docker pull ghcr.io/sidular/
          # tfcl-tf2-server:match-server` failed with "not found" and the
          # game server container never started. Fixed 2026-07-25.
          - plugin_dir: plugins-match-server
            tag: match-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (${{ matrix.tag }})
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          build-args: |
            PLUGIN_DIR=${{ matrix.plugin_dir }}
          tags: |
            ghcr.io/sidular/tfcl-tf2-server:${{ matrix.tag }}
            ghcr.io/sidular/tfcl-tf2-server:${{ matrix.tag }}-${{ github.sha }}
