/**
 * TFCL override of SourceMod's addons/sourcemod/configs/core.cfg.
 *
 * ROOT CAUSE (2026-07-26): the base melkortf/tf2-competitive image ships
 * SourceMod's stock core.cfg, whose PublicChatTrigger is "!" and
 * SilentChatTrigger is "/" - there is NO "." in either list out of the box.
 * tfcl_matchserver.sp's ready-up commands are registered with
 * RegConsoleCmd("sm_ready"/"ready"/etc, ...) (see OnPluginStart()), and
 * SourceMod's RegConsoleCmd machinery auto-generates a chat trigger for
 * each one ONLY using the character(s) listed in these two cvars - so a
 * player typing "!ready" or "/ready" in chat has always worked, but
 * ".ready" (the syntax this plugin's own in-game broadcasts and the
 * TFCL-Prime-facing docs/README explicitly tell players to use - see the
 * no-show warning broadcast and the plugin's header comment) was NEVER
 * actually wired up as a working chat trigger character - it silently did
 * nothing, since plain SourceMod has no concept of "." as a command prefix
 * at all. This has nothing to do with config_preset choice (rgl_scrim vs.
 * any other preset) - it's a base-image SourceMod core config gap that
 * affects EVERY match server regardless of which format cfg it execs.
 *
 * Fix: add "." to PublicChatTrigger alongside the stock "!", so ".ready"
 * (as well as "!ready") both work. Left SilentChatTrigger ("/") untouched.
 *
 * Deploy to: /home/tf2/server/tf/addons/sourcemod/configs/core.cfg (NOT
 * cfg/sourcemod/ - core.cfg lives under addons/sourcemod/configs/, a
 * different directory than the mapchange-exec'd sourcemod.cfg override
 * next to this file). This one is read once at SourceMod startup, not
 * re-exec'd on every map change - see tfcl-entrypoint.sh / Dockerfile
 * comment for why this doesn't matter for a match server (provisioned
 * fresh once per match, SourceMod always cold-starts before players
 * connect).
 */
"Core"
{
	"PublicChatTrigger"		"!."
	"SilentChatTrigger"		"/"
}
