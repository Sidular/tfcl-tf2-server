// TFCL ESEA-style 6v6 Base Config
// DO NOT EXEC THIS MANUALLY

exec "tfcl_base"                               // execs base config that every gamemode shares
exec "tfcl_any_custom"                         // execs the custom settings in any_custom
exec "tfcl_6s_custom"                          // execs the custom settings in 6s_custom (shared with TFCL's own 6s cfgs - no ESEA-specific custom hook needed)

mp_tournament_whitelist "cfg/esea_whitelist_6s.txt"  // sets whitelist
tftrue_whitelist_id "9279"                     // whitelist.tf/esea_6v6_s30 - ESEA 6v6 (Season 30)

// ESEA ran per-player ready-up (not "whole team readies as one block"),
// unlike RGL/TFCL's traditional mode - see tfcl_matchserver.sp's own
// .ready/.unready system, which already replicates this per-player model
// and is the ONLY supported ready path on a TFCL Prime match server
// (native F4/mp_tournament_readymode is unconditionally blocked by the
// plugin regardless of this convar's value).
mp_tournament_readymode "1"

tf_tournament_classlimit_scout "2"             // 2 scouts
tf_tournament_classlimit_soldier "2"           // 2 soldiers
tf_tournament_classlimit_pyro "2"              // max 2 pyros
tf_tournament_classlimit_demoman "1"           // 1 demoman
tf_tournament_classlimit_heavy "1"             // max 1 heavy
tf_tournament_classlimit_engineer "1"          // max 1 engineer
tf_tournament_classlimit_medic "1"             // 1 medic
tf_tournament_classlimit_sniper "1"            // max 1 sniper
tf_tournament_classlimit_spy "2"               // max 2 spies
