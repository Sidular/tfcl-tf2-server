// TFCL ESEA-style 6v6 5cp Scrim Config
// EXEC THIS MANUALLY, DO NOT EXEC THE BASE.CFG
// For scrims and practice only - use esea_6s_5cp_match for official matches.

exec "esea_6s_base"

servercfgfile "esea_6s_5cp_scrim"             // sets server cfg to this config so that it gets autoexeced on level change
mp_tournament_whitelist "cfg/esea_whitelist_6s.txt"

mp_timelimit "30"                             // sets server timelimit to 30 minutes
mp_winlimit "5"                               // sets number of wins to win each half to 5
mp_windifference "0"                          // unsets windifference
mp_maxrounds "0"                              // unsets maxrounds

mp_tournament_restart                         // restarts the tournament to apply above settings

say "TFCL ESEA-style 6v6 5cp Scrim Config Executed."
say "First to 5, 30 minute time limit. For scrims only - use esea_6s_5cp_match for official matches."
say "Per-player ready-up only: type .ready in chat (F4/native ready is disabled)."
say "To be safe, please ***CHANGELEVEL*** to reload all settings properly and prevent any crashes."
say "Exec tfcl_off or restart your server 90 seconds after you have fully finished playing."
